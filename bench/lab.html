<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — second-round probes</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin:0; padding:16px; background:#12151c; color:#e6e9ef; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:13px; margin:0 0 8px; color:#8fa3ff; text-transform:uppercase; letter-spacing:.04em; }
  section { border:1px solid #2b3242; border-radius:12px; padding:12px; margin-bottom:12px; background:#161b26; }
  input, button { font-size:15px; padding:8px 10px; border-radius:8px; border:1px solid #2b3242; background:#1a1f2b; color:#e6e9ef; }
  button { background:#4f7cff; border:0; color:#fff; font-weight:600; }
  output { display:block; font-family:ui-monospace,monospace; font-size:12px; color:#9be89b; background:#0d1017; border-radius:8px; padding:8px; margin-top:8px; white-space:pre-wrap; word-break:break-word; }
  #ce { border:1px solid #2b3242; padding:8px; border-radius:8px; min-height:24px; }
  iframe { border:1px solid #2b3242; border-radius:8px; background:#fff; }
</style>
</head>
<body>
<h1>Second-round probes</h1>

<section>
  <h2>1. Contenteditable</h2>
  <div id="ce" contenteditable="true">initial text</div>
  <output id="ceOut">—</output>
</section>

<section>
  <h2>2. Input events (isTrusted)</h2>
  <input id="ti" placeholder="type here">
  <output id="tiOut">—</output>
</section>

<section>
  <h2>3. File upload</h2>
  <input type="file" id="fi">
  <button id="inject">Inject File via DataTransfer</button>
  <output id="fiOut">—</output>
</section>

<section>
  <h2>4. Video</h2>
  <video id="vid" src="sample.mp4" muted playsinline width="220" style="border-radius:8px;background:#000"></video>
  <output id="vidOut">—</output>
</section>

<section>
  <h2>5. postMessage</h2>
  <iframe id="pmf" src="pm-inner.html" width="100%" height="90" title="postMessage child"></iframe>
  <output id="pmOut">—</output>
</section>

<section>
  <h2>6. IndexedDB</h2>
  <output id="idbOut">—</output>
</section>

<section>
  <h2>7. Service worker</h2>
  <output id="swOut">—</output>
</section>

<section>
  <h2>8. Clipboard &amp; geolocation</h2>
  <output id="cgOut">—</output>
</section>

<section>
  <h2>9. Nested scroll container</h2>
  <div id="ns" style="height:110px;overflow:auto;border:1px solid #2b3242;border-radius:8px">
    <div style="height:1200px;padding:8px">scrollable content…</div>
  </div>
  <output id="nsOut">—</output>
</section>

<section>
  <h2>10. beforeunload</h2>
  <button id="arm">Arm beforeunload, then load bye.html</button>
  <output id="buOut">armed: no</output>
</section>

<script>
  const set = (id, obj) => { document.getElementById(id).textContent = JSON.stringify(obj); };

  /* 1 + 2: event trustworthiness */
  const ce = document.getElementById('ce');
  const ti = document.getElementById('ti');
  window.__ev = { ce: [], ti: [] };
  ['beforeinput', 'input', 'keydown'].forEach(t => {
    ce.addEventListener(t, e => window.__ev.ce.push(t + ':' + e.isTrusted));
    ti.addEventListener(t, e => window.__ev.ti.push(t + ':' + e.isTrusted));
  });

  /* 3: file injection workaround */
  document.getElementById('inject').addEventListener('click', () => {
    const dt = new DataTransfer();
    dt.items.add(new File(['hello from DataTransfer'], 'injected.txt', { type: 'text/plain' }));
    document.getElementById('fi').files = dt.files;
    const f = document.getElementById('fi').files[0];
    set('fiOut', { count: document.getElementById('fi').files.length, name: f && f.name, size: f && f.size });
  });
  document.getElementById('fi').addEventListener('change', () => {
    const f = document.getElementById('fi').files[0];
    set('fiOut', { via: 'change event', name: f && f.name, size: f && f.size });
  });

  /* 4: video */
  const vid = document.getElementById('vid');
  const vidReport = () => set('vidOut', {
    readyState: vid.readyState, duration: Number(vid.duration.toFixed(2)),
    paused: vid.paused, currentTime: Number(vid.currentTime.toFixed(2)),
    videoWidth: vid.videoWidth, videoHeight: vid.videoHeight,
    error: vid.error ? vid.error.code : null
  });
  vid.addEventListener('loadedmetadata', vidReport);
  vid.addEventListener('timeupdate', vidReport);
  vid.addEventListener('error', vidReport);
  window.__videoProbe = async () => {
    let playResult;
    try { await vid.play(); playResult = 'play resolved'; }
    catch (e) { playResult = 'play rejected: ' + e.name; }
    await new Promise(r => setTimeout(r, 600));
    vid.pause();
    return { playResult, currentTime: vid.currentTime, paused: vid.paused };
  };

  /* 5: postMessage */
  window.__pm = [];
  addEventListener('message', e => window.__pm.push(e.data && e.data.type ? e.data.type : String(e.data)));
  document.getElementById('pmf').addEventListener('load', () => {
    try {
      document.getElementById('pmf').contentWindow.postMessage({ type: 'parent-to-child' }, '*');
    } catch (e) { window.__pm.push('postError:' + e.name); }
  });

  /* 6: IndexedDB */
  (function idb() {
    const req = indexedDB.open('labDB', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => set('idbOut', { error: 'open failed' });
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ hello: 'world', n: 42 }, 'probe');
      tx.oncomplete = () => {
        const r2 = db.transaction('kv').objectStore('kv').get('probe');
        r2.onsuccess = () => set('idbOut', { value: r2.result, stores: Array.from(db.objectStoreNames) });
        r2.onerror = () => set('idbOut', { error: 'get failed' });
      };
    };
  })();

  /* 7: service worker */
  (async () => {
    if (!('serviceWorker' in navigator)) { set('swOut', { supported: false }); return; }
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      const res = await fetch('lab-marker.txt', { cache: 'no-store' });
      const body = await res.text();
      set('swOut', { registered: true, scope: reg.scope, controlled: !!navigator.serviceWorker.controller, interceptedBody: body.trim() });
    } catch (e) {
      set('swOut', { registered: false, error: e.name + ': ' + e.message });
    }
  })();

  /* 8: clipboard + geolocation */
  (async () => {
    const out = {};
    try {
      await navigator.clipboard.writeText('lab-clipboard-probe');
      out.clipboardWrite = 'ok';
      out.clipboardRead = await navigator.clipboard.readText();
    } catch (e) { out.clipboardError = e.name; }
    out.geo = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve('unsupported');
      const t = setTimeout(() => resolve('timeout'), 3000);
      navigator.geolocation.getCurrentPosition(
        p => { clearTimeout(t); resolve('ok ' + p.coords.latitude.toFixed(3)); },
        e => { clearTimeout(t); resolve('error code=' + e.code + ' ' + e.message); },
        { timeout: 2500 }
      );
    });
    set('cgOut', out);
  })();

  /* 9: nested scroll */
  document.getElementById('ns').addEventListener('scroll', e => {
    set('nsOut', { scrollTop: Math.round(e.target.scrollTop) });
  });
  window.__nestedScroll = () => document.getElementById('ns').scrollTop;

  /* 10: beforeunload */
  document.getElementById('arm').addEventListener('click', () => {
    addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = 'leave?'; });
    set('buOut', { armed: true });
  });
</script>
</body>
</html>
