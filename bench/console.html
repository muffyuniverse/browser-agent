<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Console probe</title>
<style>body{font:16px system-ui;margin:0;padding:20px;background:#12151c;color:#e6e9ef}</style></head>
<body>
<h1>CONSOLE-PAGE</h1>
<p>Emits console messages at every level, plus a network error and an uncaught exception.</p>
<script>
  console.log('LOG-LINE-1');
  console.info('INFO-LINE-2');
  console.warn('WARN-LINE-3');
  console.error('ERROR-LINE-4');
  console.debug('DEBUG-LINE-5');
  setTimeout(() => { console.log('DELAYED-LOG-6'); }, 50);
  setTimeout(() => { throw new Error('UNCAUGHT-BOOM-7'); }, 120);
  fetch('/definitely-missing.json').catch(() => console.error('FETCH-FAILED-8'));
</script>
</body>
</html>
