<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialog probe</title>
<style>body{font:16px system-ui;margin:0;padding:20px;background:#12151c;color:#e6e9ef}
button{font-size:15px;padding:9px 12px;border-radius:8px;border:0;background:#4f7cff;color:#fff;margin:4px 4px 4px 0}
output{display:block;font-family:ui-monospace,monospace;font-size:12px;color:#9be89b;background:#0d1017;padding:8px;border-radius:8px;margin-top:10px}</style></head>
<body>
<h1>DIALOG-PAGE</h1>
<button id="a">alert()</button>
<button id="p">prompt()</button>
<button id="c">confirm()</button>
<output id="out">no dialog triggered yet</output>
<script>
  const out = document.getElementById('out');
  document.getElementById('a').addEventListener('click', () => {
    alert('ALERT-TEXT');
    out.textContent = 'alert returned (page continued)';
  });
  document.getElementById('p').addEventListener('click', () => {
    const v = prompt('PROMPT-TEXT', 'default');
    out.textContent = 'prompt returned: ' + JSON.stringify(v);
  });
  document.getElementById('c').addEventListener('click', () => {
    const v = confirm('CONFIRM-TEXT');
    out.textContent = 'confirm returned: ' + v;
  });
</script>
</body>
</html>
