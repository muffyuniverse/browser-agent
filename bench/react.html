<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>React controlled input probe</title>
<style>
  body { font:16px system-ui; margin:0; padding:18px; background:#12151c; color:#e6e9ef; }
  input { font-size:16px; padding:9px 10px; border-radius:8px; border:1px solid #2b3242; background:#1a1f2b; color:#e6e9ef; width:100%; box-sizing:border-box; }
  p { font-family:ui-monospace,monospace; font-size:13px; color:#9be89b; background:#0d1017; padding:8px; border-radius:8px; }
</style>
</head>
<body>
<h1 style="font-size:18px">React controlled input</h1>
<p id="status">loading React…</p>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const status = document.getElementById('status');
  if (!window.React || !window.ReactDOM) {
    status.textContent = 'React failed to load (network or CDN blocked)';
  } else {
    status.textContent = 'React ' + React.version + ' loaded';
    const { useState } = React;
    function App() {
      const [v, setV] = useState('');
      const [n, setN] = useState(0);
      return React.createElement('div', null,
        React.createElement('input', {
          id: 'ri', value: v, placeholder: 'react controlled input',
          onChange: (e) => { setV(e.target.value); setN(c => c + 1); }
        }),
        React.createElement('p', { id: 'rstate' },
          'state="' + v + '" changes=' + n)
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  }
</script>
</body>
</html>
