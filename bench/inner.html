<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inner Frame</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; background: #eef2ff; color: #16204a; }
  button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 0; background: #2fbf71; color: #fff; }
</style>
</head>
<body>
<p><strong>INNER-FRAME-OK</strong></p>
<p>This document lives inside an iframe.</p>
<button id="innerBtn">Inner counter</button>
<span id="innerCount">0</span>
<script>
  window.innerFrameLoaded = true;
  let n = 0;
  document.getElementById('innerBtn').addEventListener('click', () => {
    n++;
    document.getElementById('innerCount').textContent = String(n);
  });
</script>
</body>
</html>
